<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Химия + тігін өндірісі</title><style>body{font-family:system-ui,Arial;margin:0;background:#f2f6fa;color:#183047}header{background:#163e62;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:20px;display:grid;grid-template-columns:230px 1fr;gap:20px}nav,article{background:white;border-radius:15px;padding:20px;box-shadow:0 2px 10px #ccd5de}nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border:0;border-radius:8px;background:#eaf1f6;cursor:pointer}nav button.on{background:#176f91;color:white}h2{color:#176f91}label{display:block;padding:9px;margin:8px 0;border:1px solid #dbe5ed;border-radius:8px}button.check{background:#176f91;color:white;border:0;padding:12px 20px;border-radius:9px;cursor:pointer}#feedback{font-weight:700;margin-top:15px}@media(max-width:700px){main{display:block}nav{margin-bottom:15px}}</style><header><h1>Химия + тігін өндірісі</h1><div>1-курс · 12 электрондық оқу модулі · авторлық оқу құралы</div></header><main><nav id="menu"></nav><article id="content"></article></main><script>const mods=[{"title": "Заттардың құрылысы және тоқыма талшықтары", "theory": "Атом, молекула, химиялық байланыс", "link": "Талшық құрылымы материалдың беріктігі мен серпімділігіне әсер етеді.", "practice": "Мақта мен полиэстердің үлгілерін көзбен және қолмен салыстырып, құрылым–қасиет кестесін толтырыңыз.", "q": {"q": "Неліктен бірдей қалыңдықтағы мақта мен полиэстердің қасиеттері өзгеше?", "opts": ["Талшықтың молекулалық құрылымы", "Тек түсі", "Тек бағасы"], "correct": 0, "why": "Талшықтың молекулалық құрылымы қасиетке әсер етеді."}}, {"title": "Органикалық қосылыстар және табиғи талшықтар", "theory": "Көміртек қосылыстары, функционалдық топтар", "link": "Мақта – целлюлоза, жүн – кератин, жібек – фиброин.", "practice": "Мақта, жүн, жібек жапсырмаларын қарап, табиғи талшықтарды жіктеңіз.", "q": {"q": "Жүннің негізгі химиялық табиғаты қандай?", "opts": ["Кератин", "Целлюлоза", "Полиэстер"], "correct": 0, "why": "Жүн – ақуыздық талшық."}}, {"title": "Полимерлер және синтетикалық талшықтар", "theory": "Мономер, полимер, поликонденсация", "link": "Полиэстер мен полиамид – синтетикалық полимерлер.", "practice": "Киім заттаңбаларынан полиэстер мен полиамид үлгілерін іздеп, құрамын салыстырыңыз.", "q": {"q": "Полиэстер табиғи талшық па?", "opts": ["Жоқ, синтетикалық полимер", "Иә, өсімдік талшығы", "Иә, ақуыз"], "correct": 0, "why": "Жоқ, синтетикалық полимер."}}, {"title": "Целлюлоза және мақта матасы", "theory": "(C₆H₁₀O₅)ₙ; гидроксил топтары", "link": "Мақта ылғалды жақсы сіңіреді, бірақ өңдеу әсер етеді.", "practice": "Бірдей мөлшерде су тамызып, мақта мен полиэстер үлгілерінің сулану уақытын салыстырыңыз.", "q": {"q": "Мақтаның негізгі полимері қандай?", "opts": ["Целлюлоза", "Кератин", "Полиамид"], "correct": 0, "why": "Целлюлоза."}}, {"title": "Ақуыздар және жүн, жібек", "theory": "Пептидтік байланыс; кератин және фиброин", "link": "Ақуыздық талшықтардың күтімі температура мен pH-қа сезімтал.", "practice": "Жүн мен жібектің күтім белгілерін талдап, жұмсақ жуу режимін ұсыныңыз.", "q": {"q": "Жүн талшығының негізгі ақуызы қандай?", "opts": ["Кератин", "Целлюлоза", "ПЭТ"], "correct": 0, "why": "Кератин."}}, {"title": "Қышқылдар, негіздер және матаны өңдеу", "theory": "pH шкаласы, индикаторлар", "link": "Жуу ерітіндісінің pH-ы талшыққа және бояуға әсер етеді.", "practice": "Қауіпсіз тұрмыстық ерітінділердің pH-ын дайын индикатор қағазымен өлшеп, нәтижені тіркеңіз.", "q": {"q": "pH=3 ерітіндісі қандай орта?", "opts": ["Қышқыл орта", "Бейтарап орта", "Сілтілік орта"], "correct": 0, "why": "Қышқыл орта."}}, {"title": "Ерітінділер және бояғыш концентрациясы", "theory": "w=m(еріген зат)/m(ерітінді)×100%", "link": "Бояу ерітіндісінің концентрациясы түс қарқындылығына ықпал етеді.", "practice": "Тек тағамдық бояғышпен 1% және 2% су ерітінділерін әзірлеп, түсін салыстырыңыз.", "q": {"q": "5 г бояғыш пен 95 г судағы массалық үлес қанша?", "opts": ["1%", "5%", "10%"], "correct": 1, "why": "5%."}}, {"title": "Бояғыш заттар және матаны бояу", "theory": "Ерігіштік, адсорбция, талшықпен әрекеттесу", "link": "Түс тұрақтылығы бояғыш түріне, талшыққа және бекітуге тәуелді.", "practice": "Шай тұнбасымен мақта үлгісін бояп, құрғағаннан кейін түсін бақылаңыз.", "q": {"q": "Табиғи бояғыш әрқашан тұрақты ма?", "opts": ["Жоқ, тұрақтылығы әртүрлі", "Иә, әрқашан", "Тек түссіз болады"], "correct": 0, "why": "Жоқ, тұрақтылығы әртүрлі."}}, {"title": "Тотығу-тотықсыздану және ағарту", "theory": "Электрон алмасу; тотықтырғыш", "link": "Өнеркәсіптік ағартуда бақыланатын химиялық үдерістер қолданылады.", "practice": "Тек дайын суреттер мен бейнемодельдерден ағарту алдындағы және кейінгі матаны салыстырыңыз.", "q": {"q": "Ағарту тек механикалық тазалау ма?", "opts": ["Жоқ, химиялық өзгеріс болуы мүмкін", "Иә, тек үйкеліс", "Тек кептіру"], "correct": 0, "why": "Жоқ, химиялық өзгеріс болуы мүмкін."}}, {"title": "Беттік белсенді заттар және жуу", "theory": "Гидрофильді және гидрофобты бөлік", "link": "ББЗ майлы ласты судың көмегімен кетіруге жәрдемдеседі.", "practice": "Су мен аз мөлшердегі сабынды суға бірдей май тамшысын қосып, дисперсияны салыстырыңыз.", "q": {"q": "ББЗ молекуласының екі бөлігі қандай?", "opts": ["Гидрофильді және гидрофобты", "Екі гидрофобты", "Екі металл бөлігі"], "correct": 0, "why": "Гидрофильді және гидрофобты."}}, {"title": "Судың кермектігі және жуу сапасы", "theory": "Ca²⁺, Mg²⁺ иондары", "link": "Кермек су сабынның тиімділігін төмендетуі мүмкін.", "practice": "Таза су мен минералды суға бірдей сабын қосып, шайқап, көбігін салыстырыңыз.", "q": {"q": "Кермектікке қандай иондар жауапты?", "opts": ["Кальций және магний", "Натрий және калий", "Сутек және оттек"], "correct": 0, "why": "Кальций және магний иондары."}}, {"title": "Тоқыма өндірісіндегі химиялық қауіпсіздік", "theory": "Таңбалау, қауіп-қатер, ЖҚҚ", "link": "Бояғыштар мен тазартқыштарды қауіпсіз қолдану қажет.", "practice": "Қауіпсіздік белгілері бар үш өнімнің жапсырмасын оқып, сақтық шараларын жазыңыз.", "q": {"q": "Белгісіз реагентті иіскеуге бола ма?", "opts": ["Жоқ", "Иә", "Тек аз уақытқа"], "correct": 0, "why": "Жоқ."}}];let selected=0;function show(i){selected=i;document.getElementById('menu').innerHTML=mods.map((m,j)=>`<button class="${j===i?'on':''}" onclick="show(${j})">${j+1}. ${m.title}</button>`).join('');const m=mods[i];document.getElementById('content').innerHTML=`<small>Модуль ${i+1} / 12</small><h2>${m.title}</h2><h3>Теория</h3><p>${m.theory}</p><h3>Тігін өндірісімен байланысы</h3><p>${m.link}</p><h3>Практикалық жұмыс</h3><p>${m.practice}</p><h3>Интерактивті тест</h3><p><b>${m.q.q}</b></p>${m.q.opts.map((x,j)=>`<label><input type="radio" name="answer" value="${j}"> ${x}</label>`).join('')}<button class="check" onclick="check()">Жауапты тексеру</button><p id="feedback" aria-live="polite"></p><p><small>Ескерту: тәжірибе нәтижелері нақты бақылау кезінде толтырылады. Қауіпсіздік талаптарын сақтаңыз.</small></p>`}function check(){let a=document.querySelector('input[name=answer]:checked'),f=document.getElementById('feedback');if(!a){f.textContent='Алдымен жауапты таңдаңыз.';return}let q=mods[selected].q;f.textContent=Number(a.value)===q.correct?'✓ Дұрыс! '+q.why:'✕ Қате. Дұрыс жауап: '+q.opts[q.correct]+'. '+q.why}show(0)</script></html>
